# Cache video CHỈ khi đã sẵn sàng (200/206/304). Khi chưa transcode xong backend
# trả 404 → "no-store" để Cloudflare KHÔNG cache lại cái 404 (nếu cache, video sẽ
# "chết" tới vài giờ dù file đã xong). Frontend poll URL tới khi nhận 200.
map $upstream_status $videos_cc {
    default "no-store";
    "200"   "public, max-age=2592000, immutable";
    "206"   "public, max-age=2592000, immutable";
    "304"   "public, max-age=2592000, immutable";
}

# Redirect HTTP → HTTPS
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name beezvn.com www.beezvn.com;
    location / {
        return 301 https://$host$request_uri;
    }
}
# HTTPS
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name beezvn.com www.beezvn.com;
    ssl_certificate     /etc/letsencrypt/live/beezvn.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/beezvn.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    root /usr/share/nginx/html;
    index index.html;

    # Nén văn bản trước khi gửi. Trước đây tắt hoàn toàn nên khách tải ~556KB
    # JS+CSS thô; gzip thường giảm 70-75%, đáng kể với khách dùng 4G.
    # `gzip_vary` để proxy/CDN không phục vụ nhầm bản nén cho client không hỗ trợ.
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/javascript
               application/json application/xml image/svg+xml
               application/manifest+json;

    # Default body limit for normal API calls (images, JSON, etc.)
    client_max_body_size 20m;

    # ── Video upload: large body, no buffering, long timeouts ────────────────
    # MUST appear before the generic /api block so it wins the longest-prefix match.
    location = /api/upload/video {
        proxy_pass         http://backend:5002;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        client_max_body_size      550m;   # > multer 500MB limit
        client_body_buffer_size   1m;
        proxy_request_buffering   off;    # stream directly to backend
        proxy_buffering           off;
        proxy_read_timeout        1800s;  # 30 min for slow uploads
        proxy_send_timeout        1800s;
    }

    # ── Chunked upload: mỗi mảnh ≤60MB (< 100MB Cloudflare), file lớn tới 500MB ──
    location = /api/upload/video/chunk {
        proxy_pass         http://backend:5002;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        client_max_body_size      70m;    # > 60MB chunk + overhead
        proxy_request_buffering   off;
        proxy_read_timeout        900s;
        proxy_send_timeout        900s;
    }

    # ── Chunked image upload: mỗi mảnh ≤50MB, tổng tới 500MB ───────────────
    location = /api/upload/image/chunk {
        proxy_pass         http://backend:5002;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        client_max_body_size      70m;    # > 50MB chunk + overhead
        proxy_request_buffering   off;
        proxy_read_timeout        900s;
        proxy_send_timeout        900s;
    }

    # ── Video serving: enable Range, aggressive cache, no proxy buffering ────
    location ^~ /api/videos/ {
        proxy_pass         http://backend:5002;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Range             $http_range;
        proxy_set_header   If-Range          $http_if_range;

        proxy_buffering    off;            # stream video bytes through
        proxy_cache_bypass $http_range;
        proxy_no_cache     $http_range;
        proxy_read_timeout 600s;

        # Cache-Control phụ thuộc status: 200/206 → cache lâu; 404 (chưa xử lý xong)
        # → no-store để Cloudflare không cache cái 404. `always` để áp cả response lỗi.
        proxy_hide_header  Cache-Control;
        add_header Accept-Ranges bytes always;
        add_header Cache-Control $videos_cc always;
    }

    # Sitemap sinh từ dữ liệu thật (có đủ các trang dịch vụ) thay vì file tĩnh
    # phải sửa tay. `=` để chỉ khớp đúng đường dẫn này, không đụng gì khác.
    location = /sitemap.xml {
        proxy_pass         http://backend:5002/api/sitemap.xml;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # Proxy API (generic)
    # ^~ prevents the static-asset regex below from hijacking /api/public/uploads/*.jpg etc.
    location ^~ /api {
        proxy_pass         http://backend:5002;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        client_max_body_size 20m;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
    # SPA fallback
    location / {
        # Gộp về một tên miền: trước đây cả beezvn.com và www.beezvn.com đều
        # phục vụ nội dung nên máy tìm kiếm coi là hai website trùng nhau và chia
        # nhỏ uy tín. Chọn bản www vì mọi khai báo sẵn có (canonical, sitemap,
        # dữ liệu có cấu trúc) đều dùng www.
        #
        # Đặt Ở ĐÂY chứ không ở cấp server: để cấp server thì mọi request đều bị
        # chuyển hướng trước khi kịp vào /api — mà chuyển hướng một request POST
        # sẽ làm mất dữ liệu gửi lên.
        if ($host = beezvn.com) {
            return 301 https://www.beezvn.com$request_uri;
        }

        # Trang HTML phải hỏi lại máy chủ mỗi lần, đừng tự đoán.
        #
        # VÌ SAO: index.html trước đây trả về không kèm chỉ dẫn nhớ đệm nào, chỉ
        # có ETag và Last-Modified. Gặp vậy trình duyệt tự suy đoán độ tươi theo
        # tuổi của file — file càng cũ nó càng giữ lâu. Hậu quả: deploy xong,
        # khách quen vẫn nhận bản HTML cũ, mà bản đó trỏ tới file JS cũ, nên
        # tính năng mới KHÔNG tới được người đang dùng. Đã gặp thật.
        #
        # `no-cache` không phải "cấm lưu": trình duyệt vẫn giữ bản cũ nhưng phải
        # hỏi lại; không đổi gì thì máy chủ trả 304 rỗng, gần như không tốn gì.
        # Các file js/css/ảnh vẫn cache một năm nhờ khối regex bên dưới — chúng
        # có mã băm trong tên nên đổi nội dung là đổi luôn tên.
        add_header Cache-Control "no-cache" always;

        # ── Mỗi trang chỉ có MỘT địa chỉ ────────────────────────────────────
        # Bỏ dấu "/" ở cuối. Google đã lỡ ghi nhớ dạng có dấu "/" (vì trước đây
        # nginx chuyển hướng sang đó), nên phải đưa chúng về dạng chuẩn thay vì
        # để hai địa chỉ cùng phục vụ một trang.
        #
        # `(/.+)/` chứ không phải `(/.*)/`: dấu cộng bắt buộc có ít nhất một ký
        # tự trước dấu gạch cuối, nên chính trang chủ "/" KHÔNG khớp. Dùng dấu
        # sao là trang chủ tự chuyển hướng về chính nó — vòng lặp vô tận.
        rewrite ^(/.+)/$ $1 permanent;

        # `$uri/index.html` CHỨ KHÔNG PHẢI `$uri/`.
        #
        # `$uri/` khiến nginx nhận ra đây là thư mục rồi trả 301 để thêm dấu "/".
        # Mà bản dựng sinh mỗi trang thành một thư mục
        # (dist/service/san-xuat-tvc/index.html), nên 76 trên 77 địa chỉ trong
        # sitemap đều bị chuyển hướng. Hệ quả trong Google Search Console:
        #
        #   - "Trang có lệnh chuyển hướng" — nó lấy địa chỉ từ sitemap rồi bị
        #     đá sang địa chỉ khác
        #   - "Trang thay thế có thẻ chính tắc thích hợp" — trang đích (có dấu /)
        #     lại khai canonical về bản không dấu /, thành một vòng lòng vòng
        #
        # Ngoài ra mỗi lượt vào tốn hai lần gọi máy chủ thay vì một.
        #
        # `$uri/index.html` phục vụ thẳng file đó, không chuyển hướng, và khớp
        # đúng dạng địa chỉ mà sitemap, thẻ canonical và thanh địa chỉ đang dùng.
        try_files $uri $uri/index.html /index.html;
    }
    # Cache static assets
    # Thiếu `webp` ở đây khiến TOÀN BỘ ảnh của web không được lưu tạm — khách
    # quay lại vẫn phải tải lại từ đầu, trong khi logo .svg thì cache cả năm.
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|avif|woff2?|ttf)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}