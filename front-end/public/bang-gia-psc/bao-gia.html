<body>
<div id="site-header"></div>

<nav class="stepper" aria-label="Steps">
  <ol id="stepper">
    <li><a href="#s1" data-step="s1"><span class="n">01</span><span data-i18n="st.1"></span></a></li>
    <li><a href="#s2" data-step="s2"><span class="n">02</span><span data-i18n="st.2"></span></a></li>
    <li><a href="#s3" data-step="s3"><span class="n">03</span><span data-i18n="st.3"></span></a></li>
    <li><a href="#s4" data-step="s4"><span class="n">04</span><span data-i18n="st.4"></span></a></li>
    <li><a href="#s5" data-step="s5"><span class="n">05</span><span data-i18n="st.5"></span></a></li>
  </ol>
</nav>

<main>
  <div class="wrap-wide page-head">
    <div class="kicker" data-i18n="b.kicker"></div>
    <h1 data-i18n="b.h1"></h1>
    <p data-i18n="b.lead"></p>
  </div>

  <div class="wrap-wide builder">
    <div class="steps">
      <section class="step" id="s1">
        <h2><span class="no">01</span><span data-i18n="s1.title"></span></h2>
        <p class="sub" data-i18n="s1.sub"></p>
        <div id="slot-journey"></div>
      </section>

      <section class="step" id="s2">
        <h2><span class="no">02</span><span data-i18n="s2.title"></span></h2>
        <p class="sub" data-i18n="s2.sub"></p>
        <div id="slot-combos"></div>
      </section>

      <section class="step" id="s3">
        <h2><span class="no">03</span><span data-i18n="s3.title"></span></h2>
        <p class="sub" data-i18n="s3.sub"></p>
        <div class="where" id="slot-where"></div>
        <div id="slot-extras"></div>
      </section>

      <section class="step" id="s4">
        <h2><span class="no">04</span><span data-i18n="s4.title"></span></h2>
        <div id="slot-estimate"></div>
      </section>

      <section class="step" id="s5">
        <h2><span class="no">05</span><span data-i18n="s5.title"></span></h2>
        <p class="sub" data-i18n="s5.sub"></p>
        <form class="form" id="quote-form" novalidate>
          <div class="field" data-field="name">
            <label for="f-name" data-i18n="f.name"></label>
            <input id="f-name" name="name" type="text" autocomplete="name" data-i18n-ph="f.namePh" required>
            <div class="err" data-i18n="err.name"></div>
          </div>
          <div class="field" data-field="phone">
            <label for="f-phone" data-i18n="f.phone"></label>
            <input id="f-phone" name="phone" type="tel" autocomplete="tel" inputmode="tel" placeholder="09xx xxx xxx" required>
            <div class="err" data-i18n="err.phone"></div>
          </div>
          <div class="field" data-field="date">
            <label for="f-date" data-i18n="f.date"></label>
            <input id="f-date" name="date" type="date">
            <label class="chk" for="f-date-tbd"><input type="checkbox" id="f-date-tbd" name="dateTbd"><span data-i18n="f.dateTbd"></span></label>
            <div class="err" data-i18n="err.date"></div>
          </div>
          <div class="field" data-field="venue">
            <label for="f-venue" data-i18n="f.venue"></label>
            <input id="f-venue" name="venue" type="text" data-i18n-ph="f.venuePh">
            <div class="err" data-i18n="err.venue"></div>
          </div>
          <div class="field full" data-field="email">
            <label for="f-email" data-i18n="f.email"></label>
            <input id="f-email" name="email" type="email" autocomplete="email" data-i18n-ph="f.emailPh">
            <div class="err" data-i18n="err.email"></div>
          </div>
          <div class="field full">
            <label for="f-notes" data-i18n="f.notes"></label>
            <textarea id="f-notes" name="notes" data-i18n-ph="f.notesPh"></textarea>
          </div>
          <input class="hp" type="text" name="website" tabindex="-1" autocomplete="off" aria-hidden="true">
          <div class="submit">
            <div class="form-summary" id="form-summary" role="alert"></div>
            <div class="sent-err" id="sent-err" role="alert" data-i18n="err.send"></div>
            <button class="btn btn-primary" type="submit" id="submit-btn"><span data-i18n="form.submit"></span></button>
            <div class="priv" data-i18n="form.privacy"></div>
            <p class="trust" data-i18n="f.trust"></p>
            <a class="trust-link" id="zalo-alt" target="_blank" rel="noopener"></a>
          </div>
        </form>
      </section>
    </div>

    <aside class="summary" id="summary" aria-live="polite"></aside>
  </div>
</main>

<div class="bar" id="bar"></div>

<div id="site-footer"></div>
